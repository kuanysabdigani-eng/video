<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelsForge AI — Быстрый генератор видео</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-impact { font-family: 'Montserrat', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-rose-500 selection:text-white">

    <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50 px-6 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-600 via-purple-600 to-indigo-500 flex items-center justify-center font-bold text-xl shadow-lg shadow-rose-500/20">🎙</div>
            <div>
                <h1 class="font-bold text-base tracking-tight text-white">ReelsForge <span class="text-rose-500">AI</span></h1>
                <p class="text-xs text-slate-400">Мобильная оптимизация &middot; 1 клик</p>
            </div>
        </div>
        <button onclick="openDeployModal()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 transition">
            🚀 Vercel
        </button>
    </header>

    <!-- Toast -->
    <div id="toastNotification" class="fixed bottom-6 right-6 bg-slate-900 border border-slate-700 text-slate-200 px-4 py-3 rounded-xl shadow-2xl z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 max-w-sm">
        <span id="toastIcon" class="text-rose-500 font-bold text-lg">✨</span>
        <span id="toastText" class="text-xs font-medium leading-relaxed">Уведомление</span>
    </div>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- Controls -->
        <div class="lg:col-span-5 bg-slate-900/80 border border-slate-800/80 rounded-2xl p-5 flex flex-col gap-4 shadow-xl backdrop-blur-sm">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h2 class="font-bold text-sm text-rose-400 flex items-center gap-2 uppercase tracking-wider">
                    <span>⚡</span> 1. Сценарий
                </h2>
                <span class="text-[11px] text-slate-400">Gemini Flash</span>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Шаблон ролика</label>
                <select id="scriptTemplate" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-rose-500 text-slate-200">
                    <option value="startup">🚀 Путь стартапера / Кейс роста</option>
                    <option value="shocking">🤯 Шокирующий факт</option>
                </select>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Тема видео</label>
                <div class="flex gap-2">
                    <input type="text" id="topicInput" value="About me" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-rose-500 text-slate-200">
                    <button onclick="generateScriptWithAI()" id="aiGenBtn" class="px-4 py-2.5 bg-rose-600 hover:bg-rose-500 text-xs font-bold rounded-xl transition text-white">✨ AI</button>
                </div>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Текст субтитров</label>
                <textarea id="scriptLines" rows
